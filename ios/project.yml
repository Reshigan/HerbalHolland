# Generate the Xcode project with `xcodegen` (brew install xcodegen), then open HerbalHolland.xcodeproj.
# The .xcodeproj is not committed: this file is the source. See ios/README.md.
name: HerbalHolland
options:
  deploymentTarget: { iOS: "16.0" }
targets:
  HerbalHolland:
    type: application
    platform: iOS
    sources: [HerbalHolland]
    settings:
      base:
        PRODUCT_NAME: HerbalHolland
        PRODUCT_BUNDLE_IDENTIFIER: com.herbalholland.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # set to the Apple Developer Team ID once the account exists
    info:
      path: HerbalHolland/Info.plist
      properties:
        CFBundleDisplayName: Herbal Holland
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIColorName: Ink, UIImageName: LaunchMark }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Finds the Herbal Holland stores nearest to you.
        NSCameraUsageDescription: Lets you take a photo for a return or a product question.
