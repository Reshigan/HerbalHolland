# Postiz, the Studio's social scheduler (docs/INTEGRATIONS.md → Setting up Postiz), on the shop's server at
# https://social.herbalholland.com through the same Cloudflare tunnel. This is Postiz's own compose file
# (github.com/gitroomhq/postiz-docker-compose) with three changes: the app listens on 127.0.0.1 only (Docker's port
# rules bypass the host firewall, and only the tunnel may reach it); secrets come from .env; and the debugging extras
# (Temporal's UI and admin tools, Spotlight) are left out. Postiz, its PostgreSQL and Redis, and Temporal with its own
# PostgreSQL and Elasticsearch run on Docker's internal networks.
#   cp .env.example .env      # fill it in
#   docker compose up -d      # then route social.herbalholland.com → http://localhost:5000 in the tunnel
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest # Postiz's own tag; to hold a version, put the tag you tested here
    restart: always
    environment:
      MAIN_URL: https://social.herbalholland.com
      FRONTEND_URL: https://social.herbalholland.com
      NEXT_PUBLIC_BACKEND_URL: https://social.herbalholland.com/api
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD:?set POSTIZ_DB_PASSWORD in .env}@postiz-postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000 # inside the container, not the shop on the host
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false} # true once HQ's account exists
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: 500 # public API calls an hour: the default 30 is less than a launch day needs
      NX_ADD_PLUGINS: "false"
      # The networks the Studio posts to (docs/INTEGRATIONS.md, step 2). Facebook's app also connects Instagram.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "127.0.0.1:5000:5000"
    networks: [postiz, temporal]
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres: { condition: service_healthy }
      postiz-redis: { condition: service_healthy }
      temporal: { condition: service_healthy }

  postiz-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:?set POSTIZ_DB_PASSWORD in .env}
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres:/var/lib/postgresql/data
    networks: [postiz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postiz-redis:
    image: redis:7.2
    restart: always
    volumes:
      - postiz-redis:/data
    networks: [postiz]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-elasticsearch:/usr/share/elasticsearch/data
    networks: [temporal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  temporal-postgresql:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    networks: [temporal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks: [temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      temporal-postgresql: { condition: service_healthy }
      temporal-elasticsearch: { condition: service_healthy }

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres:
  postiz-redis:
  temporal-postgres:
  temporal-elasticsearch:

networks:
  postiz:
  temporal:
