name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Types, unit tests, the integration tests on a SQLite file built from migrations/, and the Worker build.
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only
      DEMO_MODE: "false"
      DATABASE_URL: file:.data/ci.sqlite # prisma.config.ts needs one to load; the integration tests make their own file
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: The migrations apply to a local D1 and build exactly the schema (no drift)
        run: |
          npx wrangler d1 migrations apply DB --local
          DATABASE_URL="file:$(ls .wrangler/state/v3/d1/miniflare-D1DatabaseObject/*.sqlite | grep -v metadata)" npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (a fresh SQLite file per run)
        run: npm run test:integration
      - run: npm run build
      - name: herbalholland.com builds (its own Cloudflare Worker; size budgets and content checks)
        run: npx tsx sites/herbalholland.com/build.ts

  e2e:
    # Every user journey (checkout, till, back office, HQ, shop & Rewards, trade, the books) and a crawl of every page,
    # against the Worker build under `wrangler dev` with its local D1 and R2 and the demo seed. Browser Rendering is
    # remote-only, so PDFs come back empty locally; the journeys tolerate that.
    needs: verify
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only
      APP_URL: http://127.0.0.1:3000
      DEMO_MODE: "true" # demo logins and on-screen sign-in codes for the scripted journeys
      CRON_SECRET: ci-only-cron-secret # the books journey runs the posting queue through /api/cron/frequent
      DATABASE_URL: file:.data/ci.sqlite # for prisma.config.ts; the seed is told the local D1 file
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Local D1 with the schema, then the demo seed (into that file, and its files into the local R2)
        run: |
          npx wrangler d1 migrations apply DB --local
          D1_FILE=$(ls .wrangler/state/v3/d1/miniflare-D1DatabaseObject/*.sqlite | grep -v metadata)
          echo "D1_FILE=$D1_FILE" >> "$GITHUB_ENV"
          DATABASE_URL="file:$D1_FILE" npx tsx prisma/seed.ts
        env:
          SEED_DAYS: "21"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the Worker (wrangler dev with the local D1 and R2, secrets from .dev.vars)
        run: |
          printf 'SESSION_SECRET=%s\nDEMO_MODE=%s\nAPP_URL=%s\nCRON_SECRET=%s\n' "$SESSION_SECRET" "$DEMO_MODE" "$APP_URL" "$CRON_SECRET" > .dev.vars
          (npx wrangler dev --port 3000 --ip 127.0.0.1 > server.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 2; done
      - run: node e2e/checkout.mjs test-results/e2e-checkout
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - run: node e2e/pos.mjs test-results/e2e-pos
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - run: node e2e/backoffice.mjs test-results/e2e-backoffice
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - run: node e2e/hq.mjs test-results/e2e-hq
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - run: node e2e/shop.mjs test-results/e2e-shop
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - run: node e2e/trade.mjs test-results/e2e-trade
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - run: node e2e/accounting.mjs test-results/e2e-accounting
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - name: Crawl every page as every role (broken links, server errors, crashes, timings)
        run: node e2e/crawl.mjs test-results/e2e-crawl
        env:
          BASE_URL: http://127.0.0.1:3000
          DATABASE_FILE: ${{ env.D1_FILE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            test-results
            server.log
