name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hh
          POSTGRES_PASSWORD: hh
          POSTGRES_DB: hh_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hh -d hh_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hh:hh@localhost:5432/hh_ci
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only
      DEMO_MODE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (disposable CI database)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://hh:hh@localhost:5432/hh_ci
      - run: npm run build
