name: Nightly D1 backup

# A full SQL export of the live database every night, encrypted, kept 35 days in the backups bucket
# (RUNBOOK → Backups & recovery). D1 Time Travel covers the last 30 days on its own; this is the copy we hold.
on:
  schedule:
    - cron: "17 0 * * *" # 02:17 SAST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Export
        run: npx wrangler d1 export herbal-holland --remote --output backup.sql
      - name: Encrypt
        run: |
          gzip -9 backup.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "backup.sql.gz.gpg" backup.sql.gz
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - name: Upload
        run: npx wrangler r2 object put "herbal-holland-backups/d1/$(date -u +%Y-%m-%d).sql.gz.gpg" --file backup.sql.gz.gpg --remote
