// Herbal Holland Rewards for the Play Store: a Trusted Web Activity (Chrome, full screen, no address bar) opening the
// shop and Rewards web app at /club. Everything stays in the web app; this only puts it in the Play Store. The
// address bar stays hidden once https://<host>/.well-known/assetlinks.json lists this app's signing key (both the
// upload key and the Play App Signing key; see android/README.md).
plugins { id "com.android.application" }

def host = project.findProperty("host") ?: "shop.herbalholland.com"
def code = (project.findProperty("versionCode") ?: "1") as int
def name = project.findProperty("versionName") ?: "1.0.0"

android {
    namespace "com.herbalholland.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.herbalholland.app"
        minSdk 24
        targetSdk 35
        versionCode code
        versionName name
        manifestPlaceholders = [host: host, launchUrl: "https://" + host + "/club"]
        resValue "string", "app_name", "Herbal Holland"
        resValue "string", "asset_statements", "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://" + host + "\\\" } }]"
    }
    signingConfigs {
        release {
            // The upload key is never in the repository: pass it in the environment (see android/README.md).
            storeFile System.getenv("SHOP_KEYSTORE") ? file(System.getenv("SHOP_KEYSTORE")) : null
            storePassword System.getenv("SHOP_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("SHOP_KEYSTORE_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("SHOP_KEYSTORE") ? signingConfigs.release : null
        }
    }
    lint { checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
