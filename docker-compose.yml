# Local production-like stack: Postgres + one-off migrate/seed + app.
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
      POSTGRES_DB: herbalholland
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d herbalholland"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: build }
    environment:
      DATABASE_URL: postgresql://hh:hh@db:5432/herbalholland
    command: sh -c "npx prisma migrate deploy && (test \"$$SEED\" = \"true\" && npx tsx prisma/seed.ts || true)"
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner }
    environment:
      DATABASE_URL: postgresql://hh:hh@db:5432/herbalholland
      SESSION_SECRET: change-me-to-32-plus-random-bytes-in-production
      APP_URL: http://localhost:3000
      DEMO_MODE: "true"
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
