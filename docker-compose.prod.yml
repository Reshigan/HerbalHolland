# Production on our own server (docs/RUNBOOK.md → First deploy). Every setting comes from .env on the server
# (.env.example lists them). The app and the one-off tasks use the server's own network, so DATABASE_URL is what it
# is on the server (Postgres at 127.0.0.1), and the app listens on 127.0.0.1:3000 only, for cloudflared.
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm migrate      # every release, before the new app starts
#   docker compose -f docker-compose.prod.yml up -d app
services:
  app:
    build: { context: ., target: runner }
    env_file: .env
    environment:
      HOSTNAME: 127.0.0.1
    network_mode: host
    restart: unless-stopped
    volumes: [uploads:/data/uploads] # files, when no S3/R2 bucket is set: back this volume up

  migrate:
    build: { context: ., target: build }
    env_file: .env
    environment:
      NODE_ENV: production
    network_mode: host
    command: npx prisma migrate deploy
    profiles: [tasks] # only on demand: docker compose -f docker-compose.prod.yml run --rm migrate [command]
    volumes: [uploads:/data/uploads]

volumes:
  uploads:
